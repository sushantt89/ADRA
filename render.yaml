# Render Blueprint: free static site that rebuilds whenever you push to GitHub.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: adra-client-portal
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    # Send every page address to the app so links and reloads work
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /sw.js
        name: Cache-Control
        value: no-cache
